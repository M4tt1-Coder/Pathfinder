name: Rust CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt / clippy / build / examples / test / doctest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + index + build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked --verbose

      - name: Compile examples
        run: cargo check --examples --all-features --locked --verbose

      - name: Run unit and integration tests
        run: cargo test --workspace --all-targets --locked --verbose

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked --verbose

      - name: Verify Semantic Versioning
        run: cargo semver-checks check-release
        continue-on-error: false
