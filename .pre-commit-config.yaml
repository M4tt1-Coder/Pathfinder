repos:
  - repo: local
    hooks:
      - id: rust-fmt
        name: rustfmt (cargo fmt --check)
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: rust-clippy
        name: clippy (deny warnings)
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false

      - id: rust-coverage
        name: cargo llvm-cov (85% line coverage)
        entry: bash -c 'output=$(cargo llvm-cov --workspace --all-features --all-targets --fail-under-lines 85 2>&1) || { echo "$output"; exit 1; }'
        language: system
        pass_filenames: false

      - id: rust-build
        name: cargo build
        entry: cargo build --all-features
        language: system
        pass_filenames: false

      - id: rust-examples
        name: cargo check --examples
        entry: cargo check --examples --locked
        language: system
        pass_filenames: false

      - id: rust-bench
        name: cargo bench
        entry: cargo bench --no-run --all-features
        language: system
        pass_filenames: false

      # Optional: catch dependency/security issues
      - id: rust-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [manual] # run manually, not every commit

      - id: rust-semver
        name: cargo semver-checks
        entry: cargo semver-checks check-release
        language: system
        pass_filenames: false
